<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 4 Mathematics: Shapes Around Us</title>
<style>
  :root {
    --kvs-blue: #1a365d;
    --kvs-gold: #d69e2e;
    --kvs-light-bg: #f7fafc;
    --kvs-card-bg: #ffffff;
    --text-primary: #2d3748;
    --text-secondary: #4a5568;
    --easy-green: #2f855a;
    --medium-orange: #dd6b20;
    --hard-red: #c53030;
    --border-color: #e2e8f0;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  body { background-color: var(--kvs-light-bg); color: var(--text-primary); line-height: 1.5; padding: 20px; }
  .container { max-width: 900px; margin: 0 auto; background: var(--kvs-card-bg); border-radius: var(--radius); box-shadow: 0 4px 15px rgba(0,0,0,0.08); overflow: hidden; border: 1px solid var(--border-color); }
  
  /* Header Styling */
  .header { background: var(--kvs-blue); color: white; padding: 24px; text-align: center; border-bottom: 4px solid var(--kvs-gold); position: relative; }
  .header h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 6px; letter-spacing: 0.5px; }
  .header p { font-size: 0.95rem; opacity: 0.9; color: #e2e8f0; }

  /* Screens */
  .screen { padding: 30px; display: none; }
  .screen.active { display: block; }

  /* Welcome Screen */
  .welcome-card { text-align: center; max-width: 550px; margin: 0 auto; }
  .form-group { margin: 20px 0; text-align: left; }
  .form-group label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--text-primary); }
  .form-group input { width: 100%; padding: 12px; border: 2px solid var(--border-color); border-radius: 6px; font-size: 1rem; transition: border-color 0.2s; }
  .form-group input:focus { border-color: var(--kvs-blue); outline: none; }
  
  .section-select-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px 0; }
  .sec-btn { padding: 14px; border: 2px solid var(--border-color); background: white; border-radius: 8px; cursor: pointer; font-weight: 700; transition: all 0.2s; text-align: center; }
  .sec-btn.easy { color: var(--easy-green); }
  .sec-btn.medium { color: var(--medium-orange); }
  .sec-btn.hard { color: var(--hard-red); }
  .sec-btn:hover, .sec-btn.selected { border-color: currentColor; background: #f8fafc; transform: translateY(-2px); }
  .sec-btn.selected.easy { background: #f0fff4; }
  .sec-btn.selected.medium { background: #fffaf0; }
  .sec-btn.selected.hard { background: #fff5f5; }

  /* Buttons */
  .btn-primary { background: var(--kvs-blue); color: white; border: none; padding: 12px 28px; font-size: 1rem; font-weight: 600; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
  .btn-primary:hover { background: #2c5282; }
  .btn-primary:disabled { background: #cbd5e0; cursor: not-allowed; }
  .btn-secondary { background: #edf2f7; color: var(--text-primary); border: 1px solid var(--border-color); padding: 10px 20px; font-size: 0.95rem; font-weight: 600; border-radius: 6px; cursor: pointer; }
  .btn-secondary:hover { background: #e2e8f0; }

  /* Quiz Screen Header */
  .quiz-meta { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 2px solid var(--border-color); margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .quiz-meta .diff-pill { padding: 4px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; }
  .diff-pill.easy { background: #c6f6d5; color: #22543d; }
  .diff-pill.medium { background: #feebc8; color: #7b341e; }
  .diff-pill.hard { background: #fed7d7; color: #742a2a; }
  
  .progress-bar-container { width: 100%; height: 8px; background: #edf2f7; border-radius: 4px; overflow: hidden; margin-bottom: 24px; }
  .progress-fill { height: 100%; background: var(--kvs-gold); width: 0%; transition: width 0.3s ease; }

  /* Question Area */
  .question-title { font-size: 1.15rem; font-weight: 600; color: var(--text-primary); margin-bottom: 16px; }
  .svg-container { text-align: center; background: #f8fafc; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border-color); }
  .svg-container svg { max-width: 100%; height: auto; max-height: 180px; }

  /* Options Grid */
  .options-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 24px; }
  @media(min-width: 600px) { .options-grid { grid-template-columns: 1fr 1fr; } }
  
  .option-card { border: 2px solid var(--border-color); padding: 14px; border-radius: 8px; background: white; cursor: pointer; font-weight: 500; font-size: 0.95rem; display: flex; align-items: center; transition: all 0.2s; }
  .option-card:hover:not(.disabled) { border-color: var(--kvs-blue); background: #ebf8ff; }
  .option-card.selected { border-color: var(--kvs-blue); background: #ebf8ff; }
  .option-card.correct { border-color: var(--easy-green) !important; background: #f0fff4 !important; color: #1c4532; font-weight: 700; }
  .option-card.incorrect { border-color: var(--hard-red) !important; background: #fff5f5 !important; color: #742a2a; }
  .option-card.disabled { cursor: default; }

  .opt-letter { display: inline-block; width: 28px; height: 28px; line-height: 28px; background: #edf2f7; border-radius: 50%; text-align: center; font-weight: 700; margin-right: 12px; flex-shrink: 0; font-size: 0.85rem; }
  .option-card.selected .opt-letter { background: var(--kvs-blue); color: white; }
  .option-card.correct .opt-letter { background: var(--easy-green); color: white; }
  .option-card.incorrect .opt-letter { background: var(--hard-red); color: white; }

  /* Feedback Box */
  .feedback-box { padding: 16px; border-radius: 8px; margin-bottom: 24px; font-size: 0.95rem; display: none; }
  .feedback-box.correct { background: #f0fff4; border: 1px solid #9ae6b4; color: #22543d; }
  .feedback-box.incorrect { background: #fff5f5; border: 1px solid #feb2b2; color: #742a2a; }

  /* Navigation Footer */
  .quiz-footer { display: flex; justify-content: space-between; align-items: center; }

  /* Results Screen */
  .results-header { text-align: center; margin-bottom: 24px; }
  .score-badge { font-size: 2.8rem; font-weight: 800; color: var(--kvs-blue); margin: 10px 0; }
  .report-table { width: 100%; border-collapse: collapse; margin: 20px 0; }
  .report-table th, .report-table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
  .report-table th { background: #f7fafc; font-weight: 700; color: var(--text-secondary); }
  
  .interpretation-box { background: #ebf8ff; border-left: 4px solid var(--kvs-blue); padding: 16px; border-radius: 4px; margin: 20px 0; font-size: 0.95rem; }

  .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 24px; }
  @media print { body { padding: 0; background: white; } .container { box-shadow: none; border: none; } .btn-group, .header p { display: none; } }
</style>
</head>
<body>

<div class="container">
  <header class="header">
    <h1>Chapter 1 Shapes around us</h1>
  </header>

  <!-- Welcome / Setup Screen -->
  <div id="welcomeScreen" class="screen active">
    <div class="welcome-card">
      <div class="form-group">
        <label for="studentName">Student Full Name:</label>
        <input type="text" id="studentName" placeholder="Enter student's name..." required>
      </div>

      <div class="form-group">
        <label>Select Level:</label>
        <div class="section-select-grid">
          <button class="sec-btn easy selected" onclick="selectSection('easy')">EASY<br><small style="font-weight:400">Basic Properties</small></button>
          <button class="sec-btn medium" onclick="selectSection('medium')">MEDIUM<br><small style="font-weight:400">Application & Visual</small></button>
          <button class="sec-btn hard" onclick="selectSection('hard')">HARD<br><small style="font-weight:400">Higher Order</small></button>
        </div>
      </div>

      <button class="btn-primary" style="width: 100%; padding: 14px;" onclick="startQuiz()">levels start assessment</button>
    </div>
  </div>

  <!-- Quiz Screen -->
  <div id="quizScreen" class="screen">
    <div class="quiz-meta">
      <div style="display: flex; align-items: center; gap: 10px;">
        <button class="btn-secondary" onclick="goHome()" style="padding: 4px 10px; font-size: 0.85rem;">🏠 Home</button>
        <span style="font-weight: 700; color: var(--text-secondary);" id="displayStudent">Student</span>
      </div>
      <div class="diff-pill easy" id="diffBadge">EASY</div>
      <div>
        <span style="font-weight: 700;" id="qCounter">Q 1 of 25</span>
      </div>
    </div>

    <div class="progress-bar-container">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="question-title" id="qTitle">Question text loading...</div>
    
    <div class="svg-container" id="svgContainer" style="display: none;">
      <!-- SVG diagram rendered here -->
    </div>

    <div class="options-grid" id="optionsGrid">
      <!-- 4 Option cards rendered here -->
    </div>

    <div class="feedback-box" id="feedbackBox">
      <!-- Feedback explanation -->
    </div>

    <div class="quiz-footer">
      <button class="btn-secondary" id="prevBtn" onclick="navigateQ(-1)" disabled>Previous</button>
      <button class="btn-primary" id="nextBtn" onclick="navigateQ(1)" disabled>Next Question</button>
    </div>
  </div>

  <!-- Final Results Screen -->
  <div id="resultsScreen" class="screen">
    <div class="results-header">
      <h2 style="color: var(--kvs-blue);">COMPETENCY ASSESSMENT REPORT</h2>
      <div class="score-badge" id="scorePercent">0%</div>
      <p id="totalScoreText" style="font-weight: 700; color: var(--text-primary);"></p>
    </div>

    <table class="report-table">
      <thead>
        <tr>
          <th>Student Name</th>
          <th>Section Completed</th>
          <th>Score Obtained</th>
          <th>Accuracy Rate</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td id="resName">-</td>
          <td id="resSection">-</td>
          <td id="resScore">-</td>
          <td id="resAccuracy">-</td>
        </tr>
      </tbody>
    </table>

    <div class="interpretation-box">
      <strong>Pedagogical Feedback & Learning Level:</strong>
      <p id="interpText" style="margin-top: 6px;">Assessment analysis will appear here.</p>
    </div>

    <div class="btn-group">
      <button class="btn-secondary" onclick="goHome()">🏠 Home</button>
      <button class="btn-secondary" onclick="restartCurrentSection()">Retry Current Section</button>
      <button class="btn-primary" onclick="restartQuiz()">Choose Another Section</button>
      <button class="btn-secondary" onclick="window.print()">Print / Save PDF Report</button>
    </div>
  </div>
</div>

<script>
// --- QUESTION BANK: 75 Competency-Based Questions (25 Easy, 25 Medium, 25 Hard) ---
const quizData = {
  easy: [
    {
      q: "Aarav is holding a standard postage stamp. It has 4 straight sides and 4 square corners. Its opposite sides are equal. What 2D shape is it?",
      options: ["Circle", "Rectangle", "Triangle", "Sphere"],
      ans: 1,
      exp: "Correct! A rectangle has 4 straight sides, 4 right-angled corners, and equal opposite sides."
    },
    {
      q: "Meera plays with a flat wooden coaster. She notices that its boundary is smooth with NO corners and NO straight edges. What shape is it?",
      options: ["Square", "Triangle", "Circle", "Cuboid"],
      ans: 2,
      exp: "Correct! A circle is bounded by a single continuous curved line with no straight edges or corners."
    },
    {
      q: "Look at the road yield sign shown below. How many corners (vertices) does this flat shape have?",
      svg: `<svg viewBox="0 0 100 80"><polygon points="10,10 90,10 50,70" fill="#feebc8" stroke="#dd6b20" stroke-width="4"/><text x="50" y="32" font-size="10" text-anchor="middle" font-weight="bold">YIELD</text></svg>`,
      options: ["2 corners", "3 corners", "4 corners", "0 corners"],
      ans: 1,
      exp: "Correct! A triangle is a polygon with exactly 3 straight sides and 3 corners (vertices)."
    },
    {
      q: "Kabir is playing with a standard 6-sided die in a board game. Every face of the die is an identical square. What 3D shape is the die?",
      options: ["Cuboid", "Cube", "Cylinder", "Cone"],
      ans: 1,
      exp: "Correct! A cube is a 3D solid bounded by 6 identical square faces."
    },
    {
      q: "Which of the following everyday objects has ONLY a curved surface and no flat faces at all?",
      options: ["A wooden pencil box", "A cricket ball", "A tin of beans", "An ice-cream cone"],
      ans: 1,
      exp: "Correct! A sphere (cricket ball) consists of a single continuous curved surface with no flat faces."
    },
    {
      q: "A teacher draws a closed shape on the board using 4 equal straight lines. All 4 corners form equal square angles. Which shape is drawn?",
      options: ["Triangle", "Rectangle", "Square", "Circle"],
      ans: 2,
      exp: "Correct! A square has 4 equal straight sides and 4 equal right-angled corners."
    },
    {
      q: "How many flat faces does a standard rectangular brick (cuboid) have in total?",
      svg: `<svg viewBox="0 0 120 70"><path d="M10,25 L70,25 L70,60 L10,60 Z" fill="#e2e8f0" stroke="#1a365d" stroke-width="2"/><path d="M70,25 L100,10 L100,45 L70,60 Z" fill="#cbd5e0" stroke="#1a365d" stroke-width="2"/><path d="M10,25 L40,10 L100,10 L70,25 Z" fill="#edf2f7" stroke="#1a365d" stroke-width="2"/></svg>`,
      options: ["4 faces", "6 faces", "8 faces", "12 faces"],
      ans: 1,
      exp: "Correct! A cuboid has 6 flat rectangular faces (top, bottom, and 4 sides)."
    },
    {
      q: "An unsharpened wooden pencil has two flat circular ends and one curved surface. Which 3D shape does it resemble?",
      options: ["Cylinder", "Cone", "Cube", "Sphere"],
      ans: 0,
      exp: "Correct! A cylinder has 2 parallel circular flat ends connected by 1 curved surface."
    },
    {
      q: "Look at the figure below. How many straight sides does this flat polygon have?",
      svg: `<svg viewBox="0 0 100 80"><polygon points="20,10 80,10 90,60 50,75 10,60" fill="#e6fffa" stroke="#319795" stroke-width="3"/></svg>`,
      options: ["4 sides", "5 sides", "6 sides", "3 sides"],
      ans: 1,
      exp: "Correct! Counting the line segments reveals exactly 5 straight sides (a pentagon)."
    },
    {
      q: "Rohan slides a coin across a smooth table. What shape is the flat face of a standard 5-rupee coin?",
      options: ["Square", "Triangle", "Circle", "Oval"],
      ans: 2,
      exp: "Correct! The flat face of a standard coin is a circle."
    },
    {
      q: "Which 3D shape has 1 pointed corner at the top and 1 flat circular surface at the bottom?",
      options: ["Sphere", "Cylinder", "Cone", "Cube"],
      ans: 2,
      exp: "Correct! A cone has a circular base tapering to a single vertex (apex)."
    },
    {
      q: "How many straight edges does a wooden solid cube have?",
      options: ["6 edges", "8 edges", "10 edges", "12 edges"],
      ans: 3,
      exp: "Correct! A cube has 12 straight line edges where its faces meet."
    },
    {
      q: "Which object will ROLL smoothly down an inclined wooden slope without sliding on a flat surface?",
      options: ["A matchbox", "A glass marble", "A square eraser", "A wooden building cube"],
      ans: 1,
      exp: "Correct! Spherical objects like marbles roll smoothly due to their continuous curved surface."
    },
    {
      q: "Look at the shape below. What is any closed 4-sided flat polygon called in geometry?",
      svg: `<svg viewBox="0 0 100 60"><polygon points="10,15 85,10 95,50 20,45" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="3"/></svg>`,
      options: ["Triangle", "Quadrilateral", "Pentagon", "Hexagon"],
      ans: 1,
      exp: "Correct! Any flat 2D closed geometric shape with 4 straight sides is a quadrilateral."
    },
    {
      q: "How many corners (vertices) does a solid cube have?",
      options: ["6 vertices", "8 vertices", "12 vertices", "4 vertices"],
      ans: 1,
      exp: "Correct! A cube has 8 corners (4 top vertices and 4 bottom vertices)."
    },
    {
      q: "Priya folds a square paper in half along a straight line down the middle so both halves match exactly. This fold line is called a line of:",
      options: ["Length", "Symmetry", "Angle", "Corner"],
      ans: 1,
      exp: "Correct! A line of symmetry divides a shape into two identical mirror-image halves."
    },
    {
      q: "Which geometric feature is TRUE for a circle?",
      options: ["It has 4 right angles", "It has 3 straight sides", "All points on its edge are at equal distance from the center", "It has 8 vertices"],
      ans: 2,
      exp: "Correct! By definition, every point on a circle's boundary is equidistant from its center."
    },
    {
      q: "Look at the corner of a standard textbook cover. What type of angle corner does it form?",
      options: ["A round curve", "A straight line", "A square/right angle corner", "A sharp acute tip"],
      ans: 2,
      exp: "Correct! Book pages and frames are rectangular and form 90-degree square right angles."
    },
    {
      q: "Three of the following objects have flat faces. Which object has NO flat faces?",
      options: ["A shoe box", "A tin container", "A spherical globe", "A pyramid block"],
      ans: 2,
      exp: "Correct! A spherical globe has only a curved surface with zero flat faces."
    },
    {
      q: "How many curved edges does a standard cylinder have?",
      svg: `<svg viewBox="0 0 100 90"><ellipse cx="50" cy="20" rx="35" ry="12" fill="#edf2f7" stroke="#2d3748" stroke-width="2"/><path d="M15,20 L15,70 A35,12 0 0,0 85,70 L85,20" fill="none" stroke="#2d3748" stroke-width="2"/><ellipse cx="50" cy="70" rx="35" ry="12" fill="none" stroke="#2d3748" stroke-width="2" stroke-dasharray="3,3"/></svg>`,
      options: ["0 curved edges", "1 curved edge", "2 curved edges", "4 curved edges"],
      ans: 2,
      exp: "Correct! A cylinder has 2 circular curved edges where the top and bottom flat faces meet the curved body."
    },
    {
      q: "What shape do you get if you trace around the bottom flat base of a party hat (cone) on paper?",
      options: ["Square", "Triangle", "Circle", "Rectangle"],
      ans: 2,
      exp: "Correct! The base of a cone is circular, so tracing around it yields a circle."
    },
    {
      q: "Which object is shaped like a cuboid?",
      options: ["A wooden pencil box", "A basketball", "A birthday party hat", "A battery cell"],
      ans: 0,
      exp: "Correct! A wooden pencil box has 6 rectangular faces, making it a cuboid."
    },
    {
      q: "If a shape has 3 sides and 3 corners, it is a triangle. What is a shape with 4 equal sides and 4 right angles called?",
      options: ["Rectangle", "Square", "Trapezoid", "Triangle"],
      ans: 1,
      exp: "Correct! A 4-sided polygon with all equal sides and 4 right angles is a square."
    },
    {
      q: "Look at the figure below. Which line segment is straight?",
      svg: `<svg viewBox="0 0 120 50"><path d="M10,15 Q35,40 60,15 T110,15" fill="none" stroke="#e53e3e" stroke-width="3"/><line x1="10" y1="40" x2="110" y2="40" stroke="#2f855a" stroke-width="3"/><text x="115" y="18" font-size="8">A</text><text x="115" y="43" font-size="8">B</text></svg>`,
      options: ["Line A (Curved)", "Line B (Green straight line)", "Both are straight", "Neither is straight"],
      ans: 1,
      exp: "Correct! Line B connects two endpoints directly along the shortest linear path."
    },
    {
      q: "Which geometric solid has exactly 1 vertex (corner)?",
      options: ["Cube", "Cylinder", "Cone", "Sphere"],
      ans: 2,
      exp: "Correct! A cone tapers to a single pointed apex (vertex)."
    }
  ],

  medium: [
    {
      q: "Riya says, 'Every square is a rectangle, but not every rectangle is a square.' Which statement best explains her idea?",
      options: [
        "She is wrong; squares and rectangles are completely unrelated.",
        "She is correct; a square meets all rectangle rules (4 right angles, opposite sides equal), plus all 4 sides are equal.",
        "She is wrong; rectangles have 5 sides.",
        "She is correct; because squares have curved boundaries."
      ],
      ans: 1,
      exp: "Correct! A square is a special type of rectangle where all four sides happen to be of equal length."
    },
    {
      q: "Kabir classifies a party hat, a funnel, and a tall drinking glass as cones. Which object did he classify INCORRECTLY?",
      options: ["Party hat", "Funnel", "Drinking glass", "None of them"],
      ans: 2,
      exp: "Correct! A drinking glass has parallel straight sides and 2 open circular ends (resembling a cylinder), not a cone tapering to a single apex."
    },
    {
      q: "Look at the corner formed by the two line segments below. What type of angle corner is shown?",
      svg: `<svg viewBox="0 0 100 80"><path d="M20,20 L20,60 L70,60" fill="none" stroke="#1a365d" stroke-width="3"/><rect x="20" y="50" width="10" height="10" fill="none" stroke="#e53e3e" stroke-width="2"/></svg>`,
      options: ["Acute angle (narrower than square)", "Right angle (L-shaped square corner)", "Obtuse angle (wider than square)", "Straight line"],
      ans: 1,
      exp: "Correct! An L-shaped corner forms a 90-degree right angle, indicated by the small square marker."
    },
    {
      q: "Rohan places two identical square tiles side-by-side so their edges touch completely. What single combined 2D shape do they form?",
      svg: `<svg viewBox="0 0 120 60"><rect x="20" y="10" width="40" height="40" fill="#feebc8" stroke="#dd6b20" stroke-width="2"/><rect x="60" y="10" width="40" height="40" fill="#feebc8" stroke="#dd6b20" stroke-width="2"/></svg>`,
      options: ["A larger square", "A rectangle", "A triangle", "A hexagon"],
      ans: 1,
      exp: "Correct! Placing 2 equal squares side-by-side doubles the length while keeping width constant, creating a rectangle."
    },
    {
      q: "Why are square tiles widely used for floor designs compared to circular tiles?",
      options: [
        "Square tiles are prettier.",
        "Square tiles tessellate completely without leaving gaps or overlaps.",
        "Circular tiles are impossible to manufacture.",
        "Square tiles have no corners."
      ],
      ans: 1,
      exp: "Correct! Squares tile a plane (tessellate) with 0 gaps, whereas circles leave empty spaces between them."
    },
    {
      q: "Look at the figure below. Which dotted line represents a valid line of symmetry for this isosceles triangle?",
      svg: `<svg viewBox="0 0 120 80"><polygon points="60,10 20,70 100,70" fill="#edf2f7" stroke="#2d3748" stroke-width="2"/><line x1="60" y1="10" x2="60" y2="70" stroke="#e53e3e" stroke-width="2" stroke-dasharray="4,3"/><text x="65" y="45" font-size="10" fill="#e53e3e">Line A</text></svg>`,
      options: ["Line A dividing it into left and right mirror halves", "Horizontal line across the bottom", "Diagonal line from base corner", "No line of symmetry exists"],
      ans: 0,
      exp: "Correct! The vertical bisector (Line A) folds the symmetric triangle into two matching halves."
    },
    {
      q: "If an upright triangle is rotated by half a turn (180 degrees) around its center, how will its main top point face?",
      options: ["Pointing to the right", "Pointing downwards", "Pointing to the left", "Remaining pointed upwards"],
      ans: 1,
      exp: "Correct! A 180-degree half rotation turns a shape upside down, pointing the top apex straight down."
    },
    {
      q: "If you cut a square paper diagonally from one corner straight to the opposite corner, what two shapes are produced?",
      options: ["Two smaller squares", "Two equal right-angled triangles", "Two rectangles", "Two circles"],
      ans: 1,
      exp: "Correct! Diagonal cut of a square divides it into two congruent right-angled triangles."
    },
    {
      q: "Assertion (A): A tin can (cylinder) can both roll and slide on a slope. Reason (R): It has both curved and flat surfaces.",
      options: [
        "Both A and R are correct, and R explains A.",
        "A is correct, but R is false.",
        "A is false, but R is correct.",
        "Both A and R are false."

// --- APP STATE ---
let currentState = {
  studentName: "",
  section: "easy",
  currentQIndex: 0,
  userAnswers: [],
  score: 0
};

// --- NAVIGATION & SCREEN CONTROL ---
function selectSection(sec) {
  currentState.section = sec;
  document.querySelectorAll('.sec-btn').forEach(btn => btn.classList.remove('selected'));
  document.querySelector(`.sec-btn.${sec}`).classList.add('selected');
}

function startQuiz() {
  const nameInput = document.getElementById('studentName').value.trim();
  if(!nameInput) {
    alert("Please enter the student's name to proceed.");
    return;
  }
  currentState.studentName = nameInput;
  currentState.currentQIndex = 0;
  currentState.userAnswers = new Array(quizData[currentState.section].length).fill(null);
  currentState.score = 0;

  document.getElementById('welcomeScreen').classList.remove('active');
  document.getElementById('quizScreen').classList.add('active');
  
  document.getElementById('displayStudent').textContent = currentState.studentName;
  const badge = document.getElementById('diffBadge');
  badge.textContent = currentState.section.toUpperCase();
  badge.className = `diff-pill ${currentState.section}`;

  renderQuestion();
}

function goHome() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('welcomeScreen').classList.add('active');
}

function renderQuestion() {
  const questions = quizData[currentState.section];
  const qData = questions[currentState.currentQIndex];

  // Counter & Progress
  document.getElementById('qCounter').textContent = `Q ${currentState.currentQIndex + 1} of ${questions.length}`;
  const progressPercent = ((currentState.currentQIndex + 1) / questions.length) * 100;
  document.getElementById('progressFill').style.width = `${progressPercent}%`;

  // Title
  document.getElementById('qTitle').textContent = `${currentState.currentQIndex + 1}. ${qData.q}`;

  // SVG Diagram
  const svgBox = document.getElementById('svgContainer');
  if(qData.svg) {
    svgBox.style.display = 'block';
    svgBox.innerHTML = qData.svg;
  } else {
    svgBox.style.display = 'none';
    svgBox.innerHTML = '';
  }

  // Options Grid
  const optionsGrid = document.getElementById('optionsGrid');
  optionsGrid.innerHTML = '';

  const savedAns = currentState.userAnswers[currentState.currentQIndex];
  const isAnswered = savedAns !== null;

  qData.options.forEach((optText, idx) => {
    const optCard = document.createElement('div');
    optCard.className = 'option-card';
    if(isAnswered) optCard.classList.add('disabled');

    if(isAnswered) {
      if(idx === qData.ans) optCard.classList.add('correct');
      if(savedAns === idx && idx !== qData.ans) optCard.classList.add('incorrect');
      if(savedAns === idx) optCard.classList.add('selected');
    }

    const letters = ['A', 'B', 'C', 'D'];
    optCard.innerHTML = `<span class="opt-letter">${letters[idx]}</span><span>${optText}</span>`;
    
    if(!isAnswered) {
      optCard.onclick = () => handleOptionSelect(idx);
    }
    optionsGrid.appendChild(optCard);
  });

  // Feedback Box
  const fbBox = document.getElementById('feedbackBox');
  if(isAnswered) {
    fbBox.style.display = 'block';
    if(savedAns === qData.ans) {
      fbBox.className = 'feedback-box correct';
      fbBox.innerHTML = `<strong>Correct!</strong> ${qData.exp}`;
    } else {
      fbBox.className = 'feedback-box incorrect';
      fbBox.innerHTML = `<strong>Review Required:</strong> ${qData.exp}`;
    }
  } else {
    fbBox.style.display = 'none';
  }

  // Footer Buttons
  document.getElementById('prevBtn').disabled = currentState.currentQIndex === 0;
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.disabled = !isAnswered;
  nextBtn.textContent = currentState.currentQIndex === questions.length - 1 ? "View Assessment Report" : "Next Question";
}

function handleOptionSelect(optionIdx) {
  currentState.userAnswers[currentState.currentQIndex] = optionIdx;
  renderQuestion();
}

function navigateQ(direction) {
  const questions = quizData[currentState.section];
  const newIndex = currentState.currentQIndex + direction;

  if(newIndex >= questions.length) {
    calculateAndShowResults();
    return;
  }

  if(newIndex >= 0 && newIndex < questions.length) {
    currentState.currentQIndex = newIndex;
    renderQuestion();
  }
}

function calculateAndShowResults() {
  const questions = quizData[currentState.section];
  let correctCount = 0;

  questions.forEach((qData, idx) => {
    if(currentState.userAnswers[idx] === qData.ans) {
      correctCount++;
    }
  });

  const percentage = Math.round((correctCount / questions.length) * 100);

  document.getElementById('quizScreen').classList.remove('active');
  document.getElementById('resultsScreen').classList.add('active');

  document.getElementById('scorePercent').textContent = `${percentage}%`;
  document.getElementById('totalScoreText').textContent = `Total Score: ${correctCount} / ${questions.length} Questions Correct`;
  
  document.getElementById('resName').textContent = currentState.studentName;
  document.getElementById('resSection').textContent = currentState.section.toUpperCase();
  document.getElementById('resScore').textContent = `${correctCount} / ${questions.length}`;
  document.getElementById('resAccuracy').textContent = `${percentage}%`;

  // Interpretation (NCF 2023 aligned)
  const interpText = document.getElementById('interpText');
  if(percentage >= 90) {
    interpText.textContent = "Excellent Spatial & Mathematical Competency! Demonstrates thorough understanding of 2D/3D properties, rotation, tiling, and higher-order geometric reasoning.";
  } else if(percentage >= 75) {
    interpText.textContent = "Very Good Understanding! Clear grasp of shape properties and visual identification. Ready to tackle advanced spatial visualization problems.";
  } else if(percentage >= 50) {
    interpText.textContent = "Good Understanding! Satisfactory identification of basic shapes and properties. Benefits from additional hands-on practice with nets, symmetry, and angles.";
  } else {
    interpText.textContent = "Developing Competency. Needs further guided practice with concrete 3D objects, line edges, and real-world geometric sorting.";
  }
}

function restartCurrentSection() {
  document.getElementById('resultsScreen').classList.remove('active');
  startQuiz();
}

function restartQuiz() {
  document.getElementById('resultsScreen').classList.remove('active');
  document.getElementById('welcomeScreen').classList.add('active');
}
