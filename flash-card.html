<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shapes Around Us - Mathematics Flashcards</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0F172A;
            --primary-accent: #3B82F6;
            --secondary: #10B981;
            --accent-yellow: #F59E0B;
            --accent-purple: #8B5CF6;
            --accent-rose: #F43F5E;
            --bg-gradient-1: #090D16;
            --bg-gradient-2: #1E1B4B;
            --card-front: #FFFFFF;
            --card-back: #F8FAFC;
            --text-main: #0F172A;
            --text-muted: #475569;
            --border-radius: 24px;
            --shadow-lg: 0 20px 30px -5px rgba(0, 0, 0, 0.3), 0 10px 12px -6px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', 'Fredoka', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, var(--bg-gradient-1), var(--bg-gradient-2));
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            overflow-x: hidden;
        }

        /* CHAPTER TITLE */
        .chapter-header {
            width: 100%;
            max-width: 800px;
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 14px 24px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .chapter-name {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--primary-accent);
            letter-spacing: 0.5px;
        }

        /* CONTROLS & CATEGORIES */
        .controls-wrapper {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 12px;
        }

        .mode-and-instruction {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            padding: 10px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .mode-selector {
            display: flex;
            gap: 8px;
        }

        .mode-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #F8FAFC;
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mode-btn.active {
            background: var(--primary-accent);
            color: #FFFFFF;
            border-color: var(--primary-accent);
            transform: scale(1.03);
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
        }

        .instruction-note {
            font-size: 0.85rem;
            color: #E2E8F0;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .categories-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 2px 8px 2px;
            scrollbar-width: none;
        }

        .categories-bar::-webkit-scrollbar {
            display: none;
        }

        .category-chip {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 16px;
            font-size: 0.85rem;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .category-chip:hover, .category-chip.active {
            background: var(--primary-accent);
            color: #FFFFFF;
            border-color: var(--primary-accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        /* PROGRESS BAR */
        .progress-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .progress-bar-bg {
            flex: 1;
            height: 10px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #10B981, #3B82F6);
            transition: width 0.3s ease;
            border-radius: 8px;
        }

        .progress-text {
            font-size: 0.85rem;
            font-weight: 700;
            color: #F1F5F9;
            min-width: 95px;
            text-align: right;
        }

        /* FLASHCARD SCENE */
        .card-scene {
            width: 100%;
            max-width: 600px;
            height: 460px;
            perspective: 1200px;
            margin: 0 auto 12px auto;
            position: relative;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
        }

        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: var(--border-radius);
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* FRONT FACE */
        .card-face-front {
            background: var(--card-front);
            color: var(--text-main);
        }

        .card-category-badge {
            align-self: flex-start;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 5px 14px;
            border-radius: 12px;
            background: #EFF6FF;
            color: var(--primary-accent);
            border: 1px solid #DBEAFE;
        }

        .illustration-container {
            width: 100%;
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 6px 0;
        }

        .illustration-container svg {
            max-width: 100%;
            max-height: 100%;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.08));
        }

        .card-question {
            font-size: 1.15rem;
            font-weight: 700;
            color: #0F172A;
            line-height: 1.35;
            margin-bottom: 4px;
        }

        .think-prompt {
            font-size: 0.85rem;
            color: #64748B;
            font-weight: 600;
            margin-bottom: 8px;
        }

        /* CHALLENGE MODE OPTIONS */
        .challenge-box {
            width: 100%;
            margin-bottom: 8px;
            display: none;
        }

        .challenge-box.active {
            display: block;
        }

        .mcq-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
        }

        .mcq-btn {
            background: #F8FAFC;
            border: 2px solid #E2E8F0;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
        }

        .mcq-btn:hover {
            border-color: var(--primary-accent);
            background: #EFF6FF;
        }

        .mcq-btn.selected-correct {
            background: #D1FAE5 !important;
            border-color: #10B981 !important;
            color: #065F46 !important;
        }

        .mcq-btn.selected-wrong {
            background: #FEE2E2 !important;
            border-color: #EF4444 !important;
            color: #991B1B !important;
        }

        .challenge-feedback {
            font-weight: 700;
            font-size: 0.85rem;
            margin-top: 6px;
            min-height: 20px;
        }

        .feedback-correct { color: #059669; }
        .feedback-wrong { color: #DC2626; }

        .btn-reveal {
            background: var(--primary-accent);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 16px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-reveal:hover {
            transform: translateY(-2px);
            background: #2563EB;
        }

        /* BACK FACE */
        .card-face-back {
            background: var(--card-back);
            color: var(--text-main);
            transform: rotateY(180deg);
            border: 1px solid #E2E8F0;
        }

        .answer-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--primary-accent);
            margin-bottom: 6px;
        }

        .explanation-text {
            font-size: 0.95rem;
            line-height: 1.4;
            color: #334155;
            margin-bottom: 10px;
            max-width: 95%;
            font-weight: 600;
        }

        .highlight-visual {
            width: 100%;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
            background: transparent;
            border-radius: 16px;
            padding: 10px;
        }

        .highlight-visual svg {
            max-width: 100%;
            max-height: 100%;
            filter: drop-shadow(0 6px 10px rgba(0,0,0,0.08));
        }

        .btn-back-flip {
            background: #E2E8F0;
            color: #334155;
            border: none;
            padding: 8px 20px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-back-flip:hover {
            background: #CBD5E1;
        }

        /* NAVIGATION TOOLBAR */
        .nav-toolbar {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 4px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.92);
            border: none;
            color: var(--primary);
            padding: 12px 20px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: var(--shadow-md);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-btn:hover:not(:disabled) {
            background: #FFFFFF;
            transform: translateY(-2px);
        }

        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .center-tools {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.92);
            border: none;
            color: var(--primary);
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: var(--shadow-md);
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: #FFFFFF;
            color: var(--primary-accent);
            transform: scale(1.05);
        }

        /* SUMMARY OVERLAY */
        .summary-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #FFFFFF;
            border-radius: var(--border-radius);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px;
            z-index: 10;
            border: 2px solid #E2E8F0;
            box-shadow: var(--shadow-lg);
        }

        .summary-overlay.active {
            display: flex;
        }

        .summary-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-accent);
            margin-bottom: 12px;
        }

        .summary-stats {
            font-size: 1.05rem;
            color: var(--text-main);
            margin-bottom: 24px;
            line-height: 1.6;
            font-weight: 600;
        }

        .summary-stats span {
            color: var(--secondary);
            font-weight: 700;
        }

        .summary-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .action-btn {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:hover {
            transform: scale(1.05);
            background: #059669;
        }

        .action-btn.secondary {
            background: #F1F5F9;
            color: var(--text-main);
        }

        .action-btn.secondary:hover {
            background: #E2E8F0;
        }

        @media (max-width: 640px) {
            body { padding: 10px; }
            .chapter-name { font-size: 1.3rem; }
            .card-scene { height: 470px; }
            .card-face { padding: 16px; }
            .illustration-container { height: 130px; }
            .card-question { font-size: 1.02rem; }
            .nav-btn { padding: 10px 14px; font-size: 0.8rem; }
            .mcq-options { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- CHAPTER TITLE -->
    <div class="chapter-header">
        <div class="chapter-name">Shapes Around Us</div>
    </div>

    <!-- CONTROLS & CATEGORY FILTER -->
    <div class="controls-wrapper">
        <div class="mode-and-instruction">
            <div class="mode-selector">
                <button class="mode-btn active" id="modeLearn" onclick="setMode('learn')">📚 LEARN</button>
                <button class="mode-btn" id="modeShuffle" onclick="setMode('shuffle')">🔀 SHUFFLE</button>
                <button class="mode-btn" id="modeChallenge" onclick="setMode('challenge')">🧠 CHALLENGE</button>
            </div>
            <div class="instruction-note">
                <span>💡</span> Think first. Reveal when ready!
            </div>
        </div>

        <div class="categories-bar" id="categoryBar"></div>
    </div>

    <!-- PROGRESS BAR -->
    <div class="progress-container">
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
        <div class="progress-text" id="progressText">Card 1 of 70</div>
    </div>

    <!-- FLASHCARD SCENE -->
    <div class="card-scene">
        
        <!-- SUMMARY OVERLAY -->
        <div class="summary-overlay" id="summaryOverlay">
            <div class="summary-title">🎉 Excellent Work!</div>
            <div class="summary-stats">
                Cards Viewed: <span id="statCardsViewed">0</span><br>
                Challenge Score: <span id="statScore">0 / 0</span>
            </div>
            <div class="summary-actions">
                <button class="action-btn" onclick="restartDeck()">REVIEW AGAIN</button>
                <button class="action-btn secondary" onclick="shuffleAndStart()">SHUFFLE AGAIN</button>
                <button class="action-btn secondary" onclick="resetAll()">START OVER</button>
            </div>
        </div>

        <div class="flashcard" id="flashcard">
            
            <!-- FRONT FACE -->
            <div class="card-face card-face-front">
                <div class="card-category-badge" id="cardCategory">2D SHAPES</div>
                
                <div class="illustration-container" id="frontIllustration"></div>

                <div class="card-question" id="cardQuestion">Question goes here...</div>

                <div class="think-prompt" id="thinkPrompt">"Think before you flip!"</div>

                <div class="challenge-box" id="challengeBox">
                    <div class="mcq-options" id="mcqOptions"></div>
                    <div class="challenge-feedback" id="challengeFeedback"></div>
                </div>

                <button class="btn-reveal" id="btnReveal" onclick="flipCard()">
                    <span>REVEAL ANSWER</span> ➔
                </button>
            </div>

            <!-- BACK FACE -->
            <div class="card-face card-face-back">
                <div class="answer-title" id="cardAnswer">Answer Title</div>
                
                <div class="highlight-visual" id="backIllustration"></div>

                <div class="explanation-text" id="cardExplanation">Explanation goes here...</div>

                <button class="btn-back-flip" onclick="flipCard()">
                    ⟲ Flip Back
                </button>
            </div>

        </div>
    </div>

    <!-- NAVIGATION TOOLBAR -->
    <div class="nav-toolbar">
        <button class="nav-btn" id="btnPrev" onclick="prevCard()">
            ← Previous
        </button>

        <div class="center-tools">
            <button class="icon-btn" onclick="toggleShuffle()" title="Shuffle Deck">🔀</button>
            <button class="icon-btn" onclick="restartDeck()" title="Restart Category">⟳</button>
        </div>

        <button class="nav-btn" id="btnNext" onclick="nextCard()">
            Next →
        </button>
    </div>

    <!-- JAVASCRIPT DATA & LOGIC -->
    <script>
        const allCards = [
            // ================= 2D SHAPES (1-10) =================
            {
                id: '1', category: '2D Shapes',
                question: 'How many sides does a square have, and what is special about them?',
                think: 'Count the straight borders and check their lengths.',
                options: ['3 equal sides', '4 equal sides', '4 unequal sides', '6 equal sides'], correct: '4 equal sides',
                answer: '4 Equal Sides 🟩',
                explanation: 'A square has 4 straight sides, and every single side is identical in length!',
                svgFront: `<svg viewBox="0 0 140 140" width="120" height="120"><rect x="20" y="20" width="100" height="100" fill="rgba(37, 99, 235, 0.2)" stroke="#2563EB" stroke-width="4" rx="12"/><line x1="20" y1="20" x2="120" y2="120" stroke="rgba(37, 99, 235, 0.3)" stroke-width="2" stroke-dasharray="4 4"/></svg>`,
                svgBack: `<svg viewBox="0 0 140 140" width="120" height="120"><rect x="20" y="20" width="100" height="100" fill="rgba(37, 99, 235, 0.25)" stroke="#2563EB" stroke-width="5" rx="12"/><circle cx="20" cy="20" r="7" fill="#F59E0B"/><circle cx="120" cy="20" r="7" fill="#F59E0B"/><circle cx="120" cy="120" r="7" fill="#F59E0B"/><circle cx="20" cy="120" r="7" fill="#F59E0B"/></svg>`
            },
            {
                id: '2', category: '2D Shapes',
                question: 'Are all sides of a rectangle equal in length?',
                think: 'Compare the top side to the side adjacent to it.',
                options: ['Yes, all 4 are equal', 'No, only opposite sides are equal', 'No sides are equal', 'Curved sides only'], correct: 'No, only opposite sides are equal',
                answer: 'Opposite Sides Are Equal ▭',
                explanation: 'In a rectangle, opposite sides match in length! Top matches bottom, left matches right.',
                svgFront: `<svg viewBox="0 0 160 110" width="130" height="90"><rect x="10" y="20" width="140" height="70" fill="rgba(13, 148, 136, 0.2)" stroke="#0D9488" stroke-width="4" rx="10"/></svg>`,
                svgBack: `<svg viewBox="0 0 160 110" width="130" height="90"><rect x="10" y="20" width="140" height="70" fill="rgba(13, 148, 136, 0.25)" stroke="#0D9488" stroke-width="4" rx="10"/><line x1="10" y1="20" x2="150" y2="20" stroke="#F59E0B" stroke-width="6"/><line x1="10" y1="90" x2="150" y2="90" stroke="#F59E0B" stroke-width="6"/></svg>`
            },
            {
                id: '3', category: '2D Shapes',
                question: 'How many corners (vertices) does a triangle have?',
                think: 'Count the pointy corners where sides meet!',
                options: ['2 corners', '3 corners', '4 corners', '0 corners'], correct: '3 corners',
                answer: '3 Corners (Vertices) 🔺',
                explanation: 'Tri means three! A triangle has 3 straight sides meeting at 3 pointy corners.',
                svgFront: `<svg viewBox="0 0 140 120" width="120" height="100"><polygon points="70,12 15,105 125,105" fill="rgba(217, 119, 6, 0.2)" stroke="#D97706" stroke-width="4" stroke-linejoin="round"/></svg>`,
                svgBack: `<svg viewBox="0 0 140 120" width="120" height="100"><polygon points="70,12 15,105 125,105" fill="rgba(217, 119, 6, 0.25)" stroke="#D97706" stroke-width="4" stroke-linejoin="round"/><circle cx="70" cy="12" r="7" fill="#2563EB"/><circle cx="15" cy="105" r="7" fill="#2563EB"/><circle cx="125" cy="105" r="7" fill="#2563EB"/></svg>`
            },
            {
                id: '4', category: '2D Shapes',
                question: 'What is a 5-sided flat shape called?',
                think: 'Penta comes from the Greek word for five!',
                options: ['Hexagon', 'Pentagon', 'Triangle', 'Octagon'], correct: 'Pentagon',
                answer: 'Pentagon ⬠',
                explanation: 'A Pentagon is a 2D flat shape with 5 straight sides and 5 vertices.',
                svgFront: `<svg viewBox="0 0 140 130" width="120" height="110"><polygon points="70,10 130,50 105,120 35,120 10,50" fill="rgba(124, 58, 237, 0.2)" stroke="#7C3AED" stroke-width="4" stroke-linejoin="round"/></svg>`,
                svgBack: `<svg viewBox="0 0 140 130" width="120" height="110"><polygon points="70,10 130,50 105,120 35,120 10,50" fill="rgba(124, 58, 237, 0.25)" stroke="#7C3AED" stroke-width="4" stroke-linejoin="round"/><circle cx="70" cy="10" r="5" fill="#10B981"/><circle cx="130" cy="50" r="5" fill="#10B981"/><circle cx="105" cy="120" r="5" fill="#10B981"/><circle cx="35" cy="120" r="5" fill="#10B981"/><circle cx="10" cy="50" r="5" fill="#10B981"/></svg>`
            },
            {
                id: '5', category: '2D Shapes',
                question: 'How many sides does a Hexagon have?',
                think: 'Hex sounds like Six!',
                options: ['5 sides', '6 sides', '7 sides', '8 sides'], correct: '6 sides',
                answer: '6 Sides ⬡',

        const categories = ['All', '2D Shapes', '3D Shapes', 'Angles', 'Circle', 'Shapes Around Us', 'Think & Reason', 'Mystery Shapes'];

        let activeCategory = 'All';

        let currentDeck = [...allCards];
        let currentIndex = 0;
        let cardsViewedCount = 0;
        let challengeCorrect = 0;
        let challengeAttempted = 0;
        let isFlipped = false;
        let userSelectedChallenge = false;

        window.addEventListener('DOMContentLoaded', () => {
            renderCategories();
            updateDeck();
            setupKeyboardNav();
        });

        function renderCategories() {
            const bar = document.getElementById('categoryBar');
            bar.innerHTML = '';
            categories.forEach(cat => {
                const chip = document.createElement('div');
                chip.className = `category-chip ${cat === activeCategory ? 'active' : ''}`;
                chip.innerText = getCategoryIcon(cat) + ' ' + cat;
                chip.onclick = () => selectCategory(cat);
                bar.appendChild(chip);
            });
        }

        function getCategoryIcon(cat) {
            switch(cat) {
                case '2D Shapes': return '🔷';
                case '3D Shapes': return '🧊';
                case 'Angles': return '📐';
                case 'Circle': return '⭕';
                case 'Shapes Around Us': return '🏠';
                case 'Think & Reason': return '🧠';
                case 'Mystery Shapes': return '❓';
                default: return '🌟';
            }
        }

        function selectCategory(cat) {
            activeCategory = cat;
            renderCategories();
            updateDeck();
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            if(mode === 'learn') document.getElementById('modeLearn').classList.add('active');
            if(mode === 'shuffle') document.getElementById('modeShuffle').classList.add('active');
            if(mode === 'challenge') document.getElementById('modeChallenge').classList.add('active');

            if(mode === 'shuffle') shuffleArray(currentDeck);
            currentIndex = 0;
            renderCard();
        }

        function updateDeck() {
            if(activeCategory === 'All') {
                currentDeck = [...allCards];
            } else {
                currentDeck = allCards.filter(c => c.category === activeCategory);
            }

            if(currentMode === 'shuffle') shuffleArray(currentDeck);

            currentIndex = 0;
            cardsViewedCount = 0;
            challengeCorrect = 0;
            challengeAttempted = 0;
            document.getElementById('summaryOverlay').classList.remove('active');
            renderCard();
        }

        function renderCard() {
            if(currentDeck.length === 0) return;

            isFlipped = false;
            document.getElementById('flashcard').classList.remove('is-flipped');
            userSelectedChallenge = false;

            const card = currentDeck[currentIndex];

            document.getElementById('cardCategory').innerText = card.category;
            document.getElementById('frontIllustration').innerHTML = card.svgFront;
            document.getElementById('cardQuestion').innerText = card.question;
            document.getElementById('thinkPrompt').innerText = `"${card.think}"`;

            document.getElementById('cardAnswer').innerText = card.answer;
            document.getElementById('backIllustration').innerHTML = card.svgBack;
            document.getElementById('cardExplanation').innerText = card.explanation;

            const challengeBox = document.getElementById('challengeBox');
            const mcqOptions = document.getElementById('mcqOptions');
            const feedback = document.getElementById('challengeFeedback');
            feedback.innerText = '';
            feedback.className = 'challenge-feedback';

            if(currentMode === 'challenge') {
                challengeBox.classList.add('active');
                mcqOptions.innerHTML = '';
                card.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'mcq-btn';
                    btn.innerText = opt;
                    btn.onclick = () => handleChallengeAnswer(opt, card.correct, btn);
                    mcqOptions.appendChild(btn);
                });
            } else {
                challengeBox.classList.remove('active');
            }

            const total = currentDeck.length;
            const progressPercent = ((currentIndex + 1) / total) * 100;
            document.getElementById('progressBar').style.width = `${progressPercent}%`;
            document.getElementById('progressText').innerText = `Card ${currentIndex + 1} of ${total}`;

            document.getElementById('btnPrev').disabled = (currentIndex === 0);
            document.getElementById('btnNext').disabled = (currentIndex === total - 1);
        }

        function handleChallengeAnswer(selected, correct, btnElement) {
            if(userSelectedChallenge) return;
            userSelectedChallenge = true;
            challengeAttempted++;

            const feedback = document.getElementById('challengeFeedback');
            const allMcqBtns = document.querySelectorAll('.mcq-btn');

            if(selected === correct) {
                challengeCorrect++;
                btnElement.classList.add('selected-correct');
                feedback.innerText = '✓ Great job! Correct!';
                feedback.className = 'challenge-feedback feedback-correct';
            } else {
                btnElement.classList.add('selected-wrong');
                feedback.innerText = `✗ Oops! Correct: ${correct}`;
                feedback.className = 'challenge-feedback feedback-wrong';
                allMcqBtns.forEach(b => {
                    if(b.innerText === correct) b.classList.add('selected-correct');
                });
            }
        }

        function flipCard() {
            const card = document.getElementById('flashcard');
            isFlipped = !isFlipped;
            if(isFlipped) {
                card.classList.add('is-flipped');
                cardsViewedCount++;
            } else {
                card.classList.remove('is-flipped');
            }
        }

        function nextCard() {
            if(currentIndex < currentDeck.length - 1) {
                currentIndex++;
                renderCard();
            } else {
                showSummary();
            }
        }

        function prevCard() {
            if(currentIndex > 0) {
                currentIndex--;
                renderCard();
            }
        }

        function toggleShuffle() { setMode('shuffle'); }

        function restartDeck() {
            currentIndex = 0;
            document.getElementById('summaryOverlay').classList.remove('active');
            renderCard();
        }

        function shuffleAndStart() { setMode('shuffle'); }

        function resetAll() {
            activeCategory = 'All';
            currentMode = 'learn';
            renderCategories();
            setMode('learn');
        }

        function showSummary() {
            document.getElementById('statCardsViewed').innerText = `${cardsViewedCount} of ${currentDeck.length}`;
            if(currentMode === 'challenge') {
                document.getElementById('statScore').innerText = `${challengeCorrect} / ${challengeAttempted}`;
            } else {
                document.getElementById('statScore').innerText = 'N/A (Learn Mode)';
            }
            document.getElementById('summaryOverlay').classList.add('active');
        }

        function setupKeyboardNav() {
            document.addEventListener('keydown', (e) => {
                if(e.key === 'ArrowRight') nextCard();
                else if(e.key === 'ArrowLeft') prevCard();
                else if(e.key === ' ' || e.key === 'Enter') {
                    if(e.key === ' ') e.preventDefault();
                    flipCard();
                }
            });
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }
    </script>
